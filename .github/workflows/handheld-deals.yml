name: OLED handheld deal watch
on:
  schedule:
    # GitHub's 5-min minimum is not a latency guarantee. Offset to avoid :00 stampede.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a clearly labeled setup notification test
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'expanded_sources.py'
      - 'tests/**'
      - '.github/workflows/handheld-deals.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: handheld-deal-watch
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository_owner == 'latentvicelabs'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validation tests
        run: python -m unittest discover -s tests -v
      - name: Test Issue and phone notification delivery
        if: inputs.test_notification == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PYTHON'
          import os
          import json, re
          from urllib.request import Request, urlopen
          from monitor import api_request, notification_scope
          topic = os.getenv("NTFY_TOPIC", "").strip()
          if topic:
              if not re.fullmatch(r"[a-zA-Z0-9_-]{16,100}", topic):
                  raise ValueError("Invalid notification topic")
              req = Request("https://ntfy.sh/" + topic,
                            data=("SETUP TEST — not a deal. " + notification_scope()).encode(),
                            headers={"Title": "Five-device watcher: delivery test", "Priority": "high"})
              with urlopen(req, timeout=20) as response:
                  receipt = json.load(response)
              print("ntfy accepted test notification:", receipt["id"])
          base = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          issue = api_request(base + "/issues", "POST", {
              "title": "[Setup test] Handheld deal alerts are connected — no deal",
              "body": "This is a delivery test, not a deal or a coverage test. " + notification_scope() + " Qualifying offers can trigger good-price, exceptional-price, or shipping-unverified review notifications. This test closes automatically."})
          print("Created notification test:", issue["html_url"])
          api_request(base + "/issues/" + str(issue["number"]), "PATCH", {"state": "closed"})
          PYTHON
      - name: Check merchants and discovery feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handheld-watch-${{ github.run_number }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 5
